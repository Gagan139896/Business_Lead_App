name: business_lead_app
description: "A professional dynamic SaaS CRM application built with Flutter and Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # Core Backend & State Management
  supabase_flutter: ^2.5.4
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.1

  # Utilities & Helpers
  json_annotation: ^4.9.0
  url_launcher: ^6.3.3
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints & Code Generation
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5b2a86"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  